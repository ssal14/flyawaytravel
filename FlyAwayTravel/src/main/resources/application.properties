spring.application.name=FlyAwayTravel
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flyawaytravel}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.time-zone=UTC

server.port=8080

# Usa una secret en Base64 de al menos 256 bits. Puedes generarla con:
#   openssl rand -base64 32
jwt.secret=${JWT_SECRET:Y2hhbmdlbWVwbGVhc2VjaGFuZ2VtZXBsZWFzZWNoYW5nZW1lcGxlYXNl}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
