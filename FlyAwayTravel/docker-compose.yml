services:
  db:
    image: postgres:16-alpine
    container_name: flyawaytravel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flyawaytravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flyawaytravel_pgdata:/var/lib/postgresql/data

volumes:
  flyawaytravel_pgdata:
